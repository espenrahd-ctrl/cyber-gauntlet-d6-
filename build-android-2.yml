name: Build Cyber Gauntlet Android APK

on:
  push:
    branches: [main]
    paths:
      - Cyber_Gauntlet_D6_Android_Project.zip
      - .github/workflows/build-android.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4
      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q Cyber_Gauntlet_D6_Android_Project.zip -d android-project
          test -f android-project/settings.gradle
          test -f android-project/app/build.gradle
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: android-project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK file
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-Gauntlet-D6-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
